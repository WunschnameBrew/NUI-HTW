<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Koa-AI</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="static/css/style.css">

    <!-- 3D / VRM dependencies -->
    <script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
    <script src="https://unpkg.com/fflate@0.8.0/umd/index.js"></script>
    <script src="https://unpkg.com/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.146.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://unpkg.com/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/@pixiv/three-vrm@2.1.1/lib/three-vrm.min.js"></script>
    <script src="https://unpkg.com/@pixiv/three-vrm-animation@2.1.1/lib/three-vrm-animation.min.js"></script>
</head>
<body data-ui-state="idle">

<div id="app">

    <!-- ===== Avatar stage (full viewport) ===== -->
    <div id="scene-container">
        <div class="aurora-bg" aria-hidden="true">
            <span class="blob blob-1"></span>
            <span class="blob blob-2"></span>
            <span class="blob blob-3"></span>
        </div>
        <div id="listening-rings" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>

    <!-- ===== Top bar ===== -->
    <header id="top-bar" class="glass">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            Koa<span class="brand-accent">AI</span>
        </div>

        <div class="state-badge" id="state-badge" data-state="idle" role="status" aria-live="polite">
            <span class="state-dot" aria-hidden="true"></span>
            <span class="state-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            <span class="state-label">Online</span>
        </div>

        <div id="mood-debug" class="mood-debug glass" hidden aria-live="polite">
            <span class="mood-pill" id="mood-debug-emotion">emotion: neutral</span>
            <span class="mood-pill" id="mood-debug-valence">valence: neutral (0.00)</span>
            <span class="mood-pill" id="mood-debug-confidence">confidence: 0.00</span>
        </div>

        <div class="top-actions">
            <button class="icon-btn" id="settings-btn" aria-label="Open settings" title="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
    </header>

    <!-- ===== Chat panel ===== -->
    <aside id="chat-panel" class="glass" aria-label="Conversation">
        <div class="chat-panel-header">
            <span>Conversation</span>
            <button class="icon-btn-sm" id="chat-collapse-btn" aria-label="Hide conversation" title="Hide">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </div>
        <div id="chat-window" role="log" aria-live="polite" aria-relevant="additions text">
            <!-- messages injected here -->
        </div>
    </aside>

    <!-- Reopen tab (shown when chat collapsed) -->
    <button id="chat-reopen" aria-label="Show conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Conversation
    </button>

    <!-- ===== Bottom dock ===== -->
    <div id="dock">
        <div id="text-input-bar" class="glass" hidden>
            <input type="text" id="prompt-input" placeholder="Type a message…" autocomplete="off" aria-label="Type a message">
            <button class="send-btn" id="send-btn" aria-label="Send message" title="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </div>

        <div id="control-cluster" class="glass">
            <button class="ctrl-btn" id="text-toggle-btn" aria-label="Type a message" title="Type a message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </button>

            <button class="ctrl-btn main" id="record-btn" aria-label="Record voice message" title="Talk">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            </button>

            <button class="ctrl-btn" id="stop-btn" aria-label="Stop speaking" title="Stop">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
            </button>
        </div>
    </div>

    <!-- ===== Loading overlay ===== -->
    <div id="loading-overlay">
        <div class="loader-orb" aria-hidden="true"></div>
        <div class="loading-text">Waking up Koa…</div>
    </div>

</div>

<!-- ===== Settings drawer ===== -->
<div id="settings-scrim"></div>
<aside id="settings-panel" class="glass" aria-label="Settings" aria-hidden="true">
    <div class="settings-header">
        <h3>Settings</h3>
        <button class="icon-btn-sm" id="close-settings" aria-label="Close settings" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
    </div>

    <div class="setting-item row">
        <label for="memory-toggle">Memory (database)</label>
        <span class="switch">
            <input type="checkbox" id="memory-toggle" checked>
            <span class="track" aria-hidden="true"></span>
        </span>
    </div>

    <div class="setting-item row">
        <label for="mood-debug-toggle">Mood debug indicator</label>
        <span class="switch">
            <input type="checkbox" id="mood-debug-toggle" checked>
            <span class="track" aria-hidden="true"></span>
        </span>
    </div>

    <div class="setting-item row">
        <label for="expression-preview-toggle">Expression preview panel (dev)</label>
        <span class="switch">
            <input type="checkbox" id="expression-preview-toggle">
            <span class="track" aria-hidden="true"></span>
        </span>
    </div>

    <div class="setting-item">
        <label for="system-prompt-select">Persona</label>
        <select id="system-prompt-select"></select>
    </div>

    <div class="setting-item">
        <label for="model-select">Avatar model</label>
        <select id="model-select"></select>
    </div>

    <button id="clear-chat-btn" class="danger-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
        Clear history
    </button>
</aside>

<aside id="expression-preview-panel" class="glass" hidden aria-label="Expression preview panel">
    <div class="expression-preview-header">
        <h4>Expression Preview</h4>
        <button id="expression-preview-clear" class="icon-btn-sm" title="Return to neutral" aria-label="Return to neutral">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
    </div>
    <p id="expression-preview-log" class="expression-preview-log">Load a model to inspect expressions.</p>
    <div id="expression-preview-list" class="expression-preview-list"></div>
</aside>

<script type="module" src="static/js/app.js"></script>
</body>
</html>
